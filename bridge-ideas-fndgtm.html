* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }

p { margin: 0 0 18px; color: var(--mut); }

button { margin-top: 12px; width: 100%; height: 46px; border: 0; border-radius: 12px; background: var(--acc); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
